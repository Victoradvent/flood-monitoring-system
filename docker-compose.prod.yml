version: '3.9'

# Production Docker Compose for DigitalOcean App Platform
# Use with: docker-compose -f docker-compose.prod.yml up

services:
  mqtt:
    image: eclipse-mosquitto:2-alpine
    container_name: flood_mqtt
    restart: always
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    environment:
      TZ: UTC
    ports:
      - "1883:1883"   # MQTT TCP
      - "9001:9001"   # MQTT WebSocket
    networks:
      - floodnet
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-t", "test"]
      interval: 30s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flood_backend
    restart: always
    env_file: .env.production
    depends_on:
      mqtt:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      TZ: UTC
    networks:
      - floodnet
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./react-dashboard
      dockerfile: Dockerfile
    container_name: flood_frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    environment:
      TZ: UTC
    networks:
      - floodnet
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  mosquitto_data:
    driver: local
  mosquitto_logs:
    driver: local

networks:
  floodnet:
    driver: bridge
