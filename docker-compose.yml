services:
  db:
    image: postgis/postgis:15-3.4
    container_name: flood_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d
      - db_data:/var/lib/postgresql/data
    networks:
      - floodnet

  mqtt:
    build: ./mosquitto
    container_name: flood_mqtt
    restart: always
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    ports:
      - "8883:8883"
      - "9002:9002"
    networks:
      - floodnet

  backend:
    build: ./backend
    container_name: flood_backend
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PG_HOST: db
      PG_PORT: 5432
      PG_USER: ${POSTGRES_USER}
      PG_PASS: ${POSTGRES_PASSWORD}
      PG_DB: ${POSTGRES_DB}

      MQTT_BROKER: mqtt
      MQTT_PORT: 8883
      MQTT_USER: ${MQTT_USER}
      MQTT_PASS: ${MQTT_PASS}
      MQTT_TOPIC: nodes/flood
      MQTT_TLS: ${MQTT_TLS:-true}
      MQTT_CA_FILE: /run/mqtt-certs/ca.crt

      SMS_PROVIDER: ${SMS_PROVIDER:-simulated}
      SMS_SIM_FAILURE_RATE: ${SMS_SIM_FAILURE_RATE:-0.2}
      SMS_SIM_RATE_LIMIT: ${SMS_SIM_RATE_LIMIT:-10}
      SMS_SIM_MIN_DELAY_MS: ${SMS_SIM_MIN_DELAY_MS:-100}
      SMS_SIM_MAX_DELAY_MS: ${SMS_SIM_MAX_DELAY_MS:-500}
      SMS_SIM_SEED: ${SMS_SIM_SEED:-fms-sms}

      JWT_SECRET: ${JWT_SECRET}
      PORT: 3000
    depends_on:
      - db
      - mqtt
    volumes:
      - ./mosquitto/certs:/run/mqtt-certs:ro
    ports:
      - "3000:3000"
    networks:
      - floodnet

  frontend:
    build: ./react-dashboard
    container_name: flood_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - floodnet

volumes:
  db_data:
  mosquitto_data:
  mosquitto_log:

networks:
  floodnet:
    driver: bridge
